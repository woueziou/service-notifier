server {
    listen 80;
    root /usr/share/nginx/html;

    # index.html jamais mis en cache : apres un deploiement, les onglets ouverts
    # rechargent la nouvelle version (et sa VITE_API_URL) au lieu de l'ancienne.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fichiers Vite empreintes (nom avec hash) : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Routage SPA (TanStack Router)
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
