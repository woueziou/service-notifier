# UI notifier seule (nginx statique) sur 10.20.10.24 (Dokploy 24, projet infra,
# compose notifier-ui), tant que notifier.flyasky.com y pointe (VIP Kemp).
# Elle ne joint le serveur qu'a travers le gateway :
# https://backend.flyasky.com/notifier. Voir docs/palier-sans-consul.md.
services:
  client:
    build:
      context: ../../client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-https://backend.flyasky.com/notifier}"
    ports:
      - "${CLIENT_PORT:-80}:80"
    restart: unless-stopped

# Reseau existant de Dokploy (voir deploy/backend).
networks:
  default:
    name: dokploy-network
    external: true
